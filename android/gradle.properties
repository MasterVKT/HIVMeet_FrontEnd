# Performance Gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.caching=true

# Network timeouts (seconds) — évite les Read timed out sur download.flutter.io
systemProp.http.connectionTimeout=120
systemProp.http.socketTimeout=120
systemProp.https.connectionTimeout=120
systemProp.https.socketTimeout=120

# Résilience réseau du client HTTP interne de Gradle (Apache HttpClient),
# distinct des systemProp.http.* ci-dessus (Java URLConnection, non utilisés
# par le transport de dépôt Gradle) : ces clés ciblent le téléchargement des
# artefacts moteur io.flutter:*_profile depuis storage.googleapis.com.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000

# Android configuration
android.useAndroidX=true
android.enableJetifier=true

# CORRECTION CRITIQUE: Résout le warning déprécié de vos logs d'erreur
# Votre fichier actuel cause: "WARNING: The option setting 'android.defaults.buildfeatures.buildconfig=true' is deprecated"
android.defaults.buildfeatures.buildconfig=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Kotlin configuration
kotlin.incremental=false
kotlin.code.style=official

# Configuration pour résoudre les problèmes de cache D:\pub-cache
android.injected.testOnly=false
android.builder.sdkDownload=true

# Configuration R8/ProGuard pour éviter les erreurs de minification
android.enableR8.fullMode=false

# Flutter configuration
flutter.minSdkVersion=24
flutter.targetSdkVersion=35
flutter.compileSdkVersion=35
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
